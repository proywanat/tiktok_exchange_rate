<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมุดบัญชีแลกเปลี่ยน USD-THB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F7F7F7;
    --surface:#FFFFFF;
    --border:#E4E4E4;
    --text:#111111;
    --muted:#888888;
    --green:#1A7A4A;
    --red:#C0392B;
    --radius:8px;
    color-scheme: light;
  }
  [data-theme="dark"]{
    --bg:#0F0F0F;
    --surface:#1A1A1A;
    --border:#2A2A2A;
    --text:#F0F0F0;
    --muted:#666666;
    --green:#4ADE80;
    --red:#F06B6B;
    color-scheme: dark;
  }
  *, *::before, *::after{
    transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--bg);
    font-family:'Sarabun',sans-serif;
    color:var(--text);
    min-height:100vh;
    padding:32px 20px 80px;
    font-size:15px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:800px; margin:0 auto; }

  /* token bar */
  .token-bar{
    display:flex; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:10px 14px;
    margin-bottom:24px; flex-wrap:wrap;
  }
  .token-bar label{ font-size:12px; color:var(--muted); white-space:nowrap; font-weight:600; }
  .token-input-wrap{ position:relative; flex:1; min-width:180px; }
  .token-input-wrap input{
    width:100%; font-family:'IBM Plex Mono',monospace; font-size:12px;
    padding:7px 32px 7px 10px; border:1px solid var(--border);
    border-radius:6px; background:var(--bg); color:var(--text); letter-spacing:0.2px;
  }
  .token-input-wrap input:focus{ outline:none; border-color:var(--text); background:#fff; }
  .token-eye{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer; color:var(--muted); font-size:13px; padding:2px;
  }
  .token-saved{ font-size:12px; color:var(--green); display:none; }
  .token-saved.show{ display:inline; }

  /* header */
  header{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:24px; flex-wrap:wrap; gap:12px;
  }
  header h1{ font-size:20px; font-weight:600; letter-spacing:-0.3px; }
  header .sub{ font-size:13px; color:var(--muted); margin-top:2px; }
  .badge{
    font-family:'IBM Plex Mono',monospace; font-size:11px;
    color:var(--muted); background:var(--surface);
    border:1px solid var(--border); padding:4px 10px; border-radius:20px;
  }

  /* card */
  .card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:24px; margin-bottom:16px;
  }
  .card h2{
    font-size:14px; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:0.8px;
    margin-bottom:20px;
  }

  /* form */
  label{ display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600; }
  input, select{
    width:100%; font-family:'IBM Plex Mono',monospace; font-size:14px;
    padding:9px 11px; border:1px solid var(--border); border-radius:6px;
    background:var(--bg); color:var(--text);
  }
  input:focus, select:focus{ outline:none; border-color:var(--text); background:var(--surface); }
  input[type="text"]{ font-family:'Sarabun',sans-serif; font-size:14px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }

  /* rate chip */
  .rate-chip{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono',monospace; font-size:12px;
    padding:5px 12px; border-radius:20px; margin-top:14px;
  }
  .rate-chip.idle{ background:var(--border); color:var(--muted); }
  .rate-chip.loading{ background:var(--border); color:var(--muted); }
  .rate-chip.ready{ background:var(--border); color:var(--green); font-weight:600; }
  .rate-chip.error{ background:var(--border); color:var(--red); }

  /* result */
  .result-row{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:20px; padding-top:20px; border-top:1px solid var(--border);
    flex-wrap:wrap; gap:14px;
  }
  .result-amount{
    font-family:'IBM Plex Mono',monospace;
    font-size:clamp(28px,5vw,38px); font-weight:500; color:var(--text);
  }
  .result-amount .thb-label{ font-size:14px; color:var(--muted); margin-left:6px; }

  /* stamp (เหลือไว้แต่เบามาก) */
  .stamp{ display:none; }

  /* buttons */
  button.primary{
    font-family:'Sarabun',sans-serif; font-weight:600; font-size:14px;
    padding:10px 22px; background:#1A1A1A; color:#FFFFFF;
    border:none; border-radius:6px; cursor:pointer;
    transition:opacity 0.15s ease;
  }
  [data-theme="dark"] button.primary{ background:#FFFFFF; color:#111111; }
  button.primary:hover{ opacity:0.82; }
  button.primary:active{ opacity:0.7; }
  button.primary:disabled{ opacity:0.3; cursor:not-allowed; }
  button.secondary{
    font-family:'Sarabun',sans-serif; font-weight:500; font-size:13px;
    padding:8px 16px; background:transparent; color:var(--text);
    border:1px solid var(--border); border-radius:6px; cursor:pointer;
  }
  button.secondary:hover{ border-color:var(--text); }
  button.ghost{
    font-size:12px; color:var(--muted); background:none; border:none;
    cursor:pointer; padding:4px; text-decoration:none;
  }
  button.ghost:hover{ color:var(--red); }

  /* table */
  table{ width:100%; border-collapse:collapse; font-family:'IBM Plex Mono',monospace; font-size:13px; }
  thead th{
    text-align:left; font-family:'Sarabun',sans-serif; font-size:11px; font-weight:700;
    color:var(--muted); text-transform:uppercase; letter-spacing:0.6px;
    border-bottom:1px solid var(--border); padding:8px 8px;
  }
  tbody td{ padding:10px 8px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--bg); }
  td.num{ text-align:right; }
  td.note-cell{ font-family:'Sarabun',sans-serif; font-size:13px; color:var(--muted); }
  .del-btn{
    background:none; border:1px solid var(--border); color:var(--muted);
    cursor:pointer; font-size:13px; line-height:1; padding:5px 8px;
    border-radius:6px; display:inline-flex; align-items:center; justify-content:center;
  }
  .del-btn:hover{ color:var(--red); border-color:var(--red); background:rgba(240,107,107,0.1); }
  .del-btn:active{ opacity:0.7; }

  /* pagination */
  .pagination{
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin-top:18px; flex-wrap:wrap;
  }
  .page-btn{
    font-family:'IBM Plex Mono',monospace; font-size:12px; min-width:30px; height:30px;
    padding:0 8px; border:1px solid var(--border); border-radius:6px;
    background:var(--surface); color:var(--text); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .page-btn:hover:not(:disabled):not(.active){ border-color:var(--text); }
  .page-btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .page-btn.active{ background:#1A1A1A; color:#FFFFFF; border-color:#1A1A1A; cursor:default; }
  [data-theme="dark"] .page-btn.active{ background:#FFFFFF; color:#111111; border-color:#FFFFFF; }
  .page-info{
    font-size:12px; color:var(--muted); font-family:'IBM Plex Mono',monospace; margin:0 8px;
    white-space:nowrap;
  }

  /* filter bar */
  .filter-bar{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:flex-end; }
  .filter-bar > div{ min-width:120px; }

  .empty-state{
    text-align:center; padding:40px 10px;
    color:var(--muted); font-size:13px;
  }

  /* month summary */
  .month-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; }
  .month-item{
    border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px; background:var(--surface);
  }
  .month-item .mi-label{ font-size:11px; color:var(--muted); font-weight:600; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px; }
  .month-item .mi-total{ font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:500; color:var(--text); }
  .month-item .mi-count{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); margin-top:4px; }

  /* spinner */
  .spin{
    display:inline-block; width:10px; height:10px;
    border:1.5px solid currentColor; border-top-color:transparent;
    border-radius:50%; animation:spin 0.6s linear infinite; vertical-align:middle;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* toast */
  .toast{
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(8px);
    background:var(--text); color:#fff; padding:9px 18px; border-radius:20px;
    font-size:13px; opacity:0; pointer-events:none;
    transition:opacity 0.2s ease, transform 0.2s ease; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  footer{ text-align:center; font-size:11px; color:var(--muted); margin-top:32px; }
  hr{ border:none; border-top:1px solid var(--border); margin:0; }

  /* theme toggle */
  .theme-toggle{
    background:none; border:1px solid var(--border); border-radius:20px;
    padding:5px 12px; cursor:pointer; font-size:12px; color:var(--muted);
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .theme-toggle:hover{ border-color:var(--text); color:var(--text); }
  .theme-toggle .icon{ font-size:13px; line-height:1; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Token bar -->
  <div class="token-bar">
    <label>API TOKEN</label>
    <div class="token-input-wrap">
      <input type="password" id="api-token" placeholder="วาง Authorization Token ที่ได้รับจาก BOT Open Data Portal" autocomplete="off">
      <button class="token-eye" onclick="toggleToken()" id="token-eye-btn">👁</button>
    </div>
    <button class="secondary" style="white-space:nowrap; padding:7px 14px; font-size:12px;" onclick="saveToken()">บันทึก</button>
    <span class="token-saved" id="token-saved-label">✓ บันทึกแล้ว</span>
  </div>

  <header>
    <div>
      <h1>USD → THB</h1>
      <div class="sub">อัตราขายถัวเฉลี่ย · ธนาคารแห่งประเทศไทย</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <div class="badge" id="history-badge">ยังไม่มีรายการ</div>
      <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">
        <span class="icon" id="theme-icon">🌙</span>
        <span id="theme-label">Dark</span>
      </button>
    </div>
  </header>

  <!-- CALC -->
  <section class="card">
    <div id="calc-stamp" class="stamp">
      <div class="s-label">อัตราขาย</div>
      <div class="s-rate" id="stamp-rate">-</div>
      <div class="s-date" id="stamp-date">-</div>
    </div>
    <h2>คำนวณ</h2>
    <div class="grid">
      <div>
        <label for="calc-date">วันที่ทำรายการ</label>
        <input type="date" id="calc-date">
      </div>
      <div>
        <label for="calc-usd">จำนวนเงิน (USD)</label>
        <input type="number" id="calc-usd" step="0.01" placeholder="เช่น 1000">
      </div>
      <div>
        <label for="calc-note">หมายเหตุ (ไม่บังคับ)</label>
        <input type="text" id="calc-note" placeholder="เช่น ใบสั่งซื้อ #123">
      </div>
    </div>

    <!-- rate chip แสดงสถานะอัตราที่ดึงมา -->
    <div id="rate-chip" class="rate-chip idle">เลือกวันที่เพื่อดึงอัตราจาก BOT</div>

    <div class="result-row">
      <div>
        <div class="result-amount" id="result-amount">0.00<span class="thb-label">THB</span></div>
      </div>
      <button class="primary" id="btn-calc" onclick="doCalculate()" disabled>คำนวณและบันทึก</button>
    </div>
  </section>

  <!-- HISTORY -->
  <section class="card">
    <h2>ประวัติรายการ</h2>
    <div class="filter-bar">
      <div>
        <label for="filter-view">ดูแบบ</label>
        <select id="filter-view" onchange="onFilterChange()">
          <option value="all">ทั้งหมด</option>
          <option value="day">รายวัน</option>
          <option value="month">รายเดือน</option>
          <option value="year">รายปี</option>
        </select>
      </div>
      <div id="filter-val-wrap" style="display:none;">
        <label for="filter-value">เลือกช่วง</label>
        <input type="text" id="filter-value" onchange="renderHistory()">
      </div>
      <div style="flex:1;"></div>
      <button class="secondary" onclick="exportExcel()">Export Excel</button>
      <button class="ghost" onclick="clearAll()">ล้างข้อมูลทั้งหมด</button>
    </div>
    <div id="history-wrap">
      <div class="empty-state">ยังไม่มีรายการ</div>
    </div>
  </section>

  <!-- MONTHLY SUMMARY -->
  <section class="card">
    <h2>สรุปรายเดือน</h2>
    <div id="summary-wrap">
      <div class="empty-state">ยังไม่มีข้อมูล</div>
    </div>
  </section>

  <footer>ข้อมูลถูกเก็บใน localStorage · ไม่มีการส่งออกนอกเครื่อง</footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* ─── Constants ─── */
const BOT_URL   = 'https://gateway.api.bot.or.th/Stat-ExchangeRate/v2/DAILY_AVG_EXG_RATE/';
const KEY_TOKEN = 'fx_bot_token';
const KEY_HIST  = 'fx_history';

/* ─── Storage helpers ─── */
const loadHistory = () => { try{ return JSON.parse(localStorage.getItem(KEY_HIST))||[]; }catch(e){ return []; } };
const saveHistory = h => localStorage.setItem(KEY_HIST, JSON.stringify(h));
const loadToken   = ()  => localStorage.getItem(KEY_TOKEN) || '';
const storeToken  = t  => localStorage.setItem(KEY_TOKEN, t);

/* ─── Misc helpers ─── */
const fmt = (n,d=2) => Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const todayStr = () => new Date().toISOString().slice(0,10);
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
function escHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

/* ─── Token bar ─── */
function toggleToken(){
  const inp=document.getElementById('api-token');
  const btn=document.getElementById('token-eye-btn');
  if(inp.type==='password'){ inp.type='text'; btn.textContent='🙈'; }
  else { inp.type='password'; btn.textContent='👁'; }
}
function saveToken(){
  const t=document.getElementById('api-token').value.trim();
  if(!t){ showToast('กรุณากรอก Token ก่อน'); return; }
  storeToken(t);
  const lbl=document.getElementById('token-saved-label');
  lbl.classList.add('show');
  setTimeout(()=>lbl.classList.remove('show'),2500);
  showToast('บันทึก Token เรียบร้อย');
}

/* ─── BOT API fetch (single date) ─── */
let rateCache = {}; // date → { rate, actualDate } | null

// ดึงอัตราจาก API สำหรับวันเดียว (ไม่ fallback)
async function fetchRawRate(dateStr){
  if(rateCache[dateStr] !== undefined) return rateCache[dateStr];

  const token = document.getElementById('api-token').value.trim() || loadToken();
  if(!token) return null;

  // เรียกผ่าน proxy server (/api/rate) เพื่อหลีกเลี่ยงปัญหา CORS
  const params = new URLSearchParams({
    start_period: dateStr,
    end_period:   dateStr,
    currency:     'USD',
    token:        token
  });
  const res = await fetch(`/api/rate?${params}`, { method: 'GET' });
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();

  let items = data?.result?.data?.data_detail
           ?? data?.result?.data
           ?? data?.data
           ?? [];
  if(!Array.isArray(items)) items = [];

  for(const item of items){
    const sellRaw = item.selling ?? item.SELLING ?? item.sell ?? null;
    if(sellRaw !== null && sellRaw !== '' && sellRaw !== '-'){
      const rate = parseFloat(sellRaw);
      if(!isNaN(rate) && rate > 0){
        rateCache[dateStr] = { rate, actualDate: dateStr };
        return rateCache[dateStr];
      }
    }
  }
  rateCache[dateStr] = null;
  return null;
}

// ดึงอัตรา + fallback ย้อนหลังสูงสุด 7 วันถ้าวันนั้นไม่มีข้อมูล
async function fetchRateForDate(dateStr){
  const MAX_LOOKBACK = 7;
  for(let i = 0; i <= MAX_LOOKBACK; i++){
    const d = new Date(dateStr);
    d.setDate(d.getDate() - i);
    const tryDate = d.toISOString().slice(0, 10);
    const result = await fetchRawRate(tryDate);
    if(result !== null) return result; // { rate, actualDate }
  }
  return null;
}

/* ─── Calc: date change → auto-fetch rate ─── */
let currentRate     = null;
let currentRateDate = null; // วันที่จริงที่ใช้อัตรา (อาจ fallback)
let fetchTimer      = null;

document.getElementById('calc-date').addEventListener('change', onDateChange);
document.getElementById('calc-usd').addEventListener('input', updateResultDisplay);

async function onDateChange(){
  const date = document.getElementById('calc-date').value;
  if(!date){ setChip('idle','เลือกวันที่เพื่อดึงอัตราจาก BOT'); return; }

  const token = document.getElementById('api-token').value.trim() || loadToken();
  if(!token){
    setChip('error','⚠ กรุณากรอก Token ด้านบนก่อน');
    currentRate = null; updateResultDisplay(); return;
  }

  setChip('loading','<span class="spin"></span> กำลังดึงอัตราจาก BOT...');
  document.getElementById('btn-calc').disabled = true;
  currentRate = null;

  clearTimeout(fetchTimer);
  fetchTimer = setTimeout(async ()=>{
    try{
      const result = await fetchRateForDate(date);
      if(result === null){
        setChip('error',`ไม่มีข้อมูลอัตราในช่วง 7 วันก่อนหน้า ${date}`);
        currentRate = null;
        currentRateDate = null;
      } else {
        const isFallback = result.actualDate !== date;
        const fallbackNote = isFallback
          ? ` <span style="opacity:0.75;font-size:11px">(ใช้อัตราวันที่ ${result.actualDate} แทน)</span>`
          : '';
        setChip('ready',`อัตราขาย ${fmt(result.rate,4)} THB/USD${fallbackNote}`);
        currentRate = result.rate;
        currentRateDate = result.actualDate;
        document.getElementById('btn-calc').disabled = false;
      }
    } catch(err){
      const msg = err.message.includes('401') ? 'Token ไม่ถูกต้อง (401)'
                : err.message.includes('403') ? 'ไม่มีสิทธิ์เข้าถึง (403)'
                : err.message;
      setChip('error',`✕ ${msg}`);
      currentRate = null;
    }
    updateResultDisplay();
  }, 300); // debounce 300ms
}

function setChip(type, html){
  const el = document.getElementById('rate-chip');
  el.className = `rate-chip ${type}`;
  el.innerHTML = html;
}

function updateResultDisplay(){
  const usd = parseFloat(document.getElementById('calc-usd').value) || 0;
  const thb = currentRate ? usd * currentRate : 0;
  document.getElementById('result-amount').innerHTML =
    `${fmt(thb,2)}<span class="thb-label">THB</span>`;
  document.getElementById('btn-calc').disabled = !(currentRate && usd > 0);
}

/* ─── Do calculate & save ─── */
function doCalculate(){
  const date = document.getElementById('calc-date').value;
  const usd  = parseFloat(document.getElementById('calc-usd').value);
  const note = document.getElementById('calc-note').value.trim();

  if(!date || !currentRate || isNaN(usd) || usd <= 0) return;

  const thb = usd * currentRate;
  const rec = { id:Date.now(), date, usd, rate:currentRate, rateDate:currentRateDate, thb, note };
  const hist = loadHistory();
  hist.push(rec);
  saveHistory(hist);

  // stamp animation
  const stamp = document.getElementById('calc-stamp');
  document.getElementById('stamp-rate').textContent = fmt(currentRate,4);
  document.getElementById('stamp-date').textContent = date;
  stamp.classList.remove('show');
  void stamp.offsetWidth;
  stamp.classList.add('show');

  document.getElementById('calc-usd').value = '';
  document.getElementById('calc-note').value = '';
  updateResultDisplay();
  updateBadge();
  renderHistory();
  renderSummary();
  showToast(`บันทึกแล้ว · ${fmt(usd,2)} USD = ${fmt(thb,2)} THB`);
}

/* ─── Badge ─── */
function updateBadge(){
  const n = loadHistory().length;
  document.getElementById('history-badge').textContent =
    n > 0 ? `${n} รายการ` : 'ยังไม่มีรายการ';
}

/* ─── Filter ─── */
function onFilterChange(){
  const v = document.getElementById('filter-view').value;
  const wrap = document.getElementById('filter-val-wrap');
  const inp  = document.getElementById('filter-value');
  if(v==='all'){ wrap.style.display='none'; }
  else {
    wrap.style.display='block';
    if(v==='day')        { inp.type='date';   inp.placeholder=''; }
    else if(v==='month') { inp.type='month';  inp.placeholder=''; }
    else if(v==='year')  { inp.type='number'; inp.placeholder='เช่น 2026'; }
  }
  historyPage = 1;
  renderHistory();
}

/* ─── History table (with pagination) ─── */
const HISTORY_PAGE_SIZE = 10;
let historyPage = 1;

function goToHistoryPage(p){
  historyPage = p;
  renderHistory();
}

function renderHistory(){
  const hist = loadHistory().slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const view = document.getElementById('filter-view').value;
  const val  = document.getElementById('filter-value').value;

  let rows = hist;
  if(view==='day'   && val) rows = hist.filter(r=>r.date===val);
  if(view==='month' && val) rows = hist.filter(r=>r.date.slice(0,7)===val);
  if(view==='year'  && val) rows = hist.filter(r=>r.date.slice(0,4)===String(val));

  const wrap = document.getElementById('history-wrap');
  if(!rows.length){ wrap.innerHTML='<div class="empty-state">ไม่พบรายการในช่วงที่เลือก</div>'; return; }

  const totalPages = Math.max(1, Math.ceil(rows.length / HISTORY_PAGE_SIZE));
  if(historyPage > totalPages) historyPage = totalPages;
  if(historyPage < 1) historyPage = 1;

  const start = (historyPage - 1) * HISTORY_PAGE_SIZE;
  const pageRows = rows.slice(start, start + HISTORY_PAGE_SIZE);

  let html = `<table>
    <thead><tr>
      <th>วันที่</th>
      <th style="text-align:right">USD</th>
      <th style="text-align:right">อัตราขาย</th>
      <th style="text-align:right">THB</th>
      <th>หมายเหตุ</th>
      <th></th>
    </tr></thead>
    <tbody>${pageRows.map(r=>`
      <tr>
        <td>${r.date}</td>
        <td class="num">${fmt(r.usd,2)}</td>
        <td class="num">${fmt(r.rate,4)}${r.rateDate && r.rateDate!==r.date ? `<span title="ใช้อัตราวันที่ ${r.rateDate}" style="color:var(--stamp);font-size:10px;margin-left:2px">*</span>` : ''}</td>
        <td class="num">${fmt(r.thb,2)}</td>
        <td class="note-cell">${r.note?escHtml(r.note):'—'}</td>
        <td><button class="del-btn" title="ลบรายการ" onclick="delRecord(${r.id})">✕</button></td>
      </tr>`).join('')}
    </tbody></table>`;

  html += renderPagination(historyPage, totalPages, rows.length);
  wrap.innerHTML = html;
}

function renderPagination(page, totalPages, totalRows){
  if(totalPages <= 1) return '';

  const btn = (label, target, opts={}) =>
    `<button class="page-btn${opts.active?' active':''}" ${opts.disabled?'disabled':''}
      onclick="goToHistoryPage(${target})" aria-label="${opts.aria||label}">${label}</button>`;

  let pages = '';
  const addPage = n => pages += btn(n, n, { active: n===page });

  // แสดงเลขหน้าแบบย่อ: หน้าแรก, หน้าใกล้ปัจจุบัน, หน้าสุดท้าย
  const windowSize = 1;
  const shown = new Set([1, totalPages]);
  for(let n=page-windowSize; n<=page+windowSize; n++) if(n>=1 && n<=totalPages) shown.add(n);
  const sorted = [...shown].sort((a,b)=>a-b);

  let prev = 0;
  for(const n of sorted){
    if(prev && n - prev > 1) pages += `<span class="page-info">…</span>`;
    addPage(n);
    prev = n;
  }

  return `<div class="pagination">
    ${btn('‹', page-1, { disabled: page===1, aria:'หน้าก่อนหน้า' })}
    ${pages}
    ${btn('›', page+1, { disabled: page===totalPages, aria:'หน้าถัดไป' })}
    <span class="page-info">${totalRows} รายการ</span>
  </div>`;
}

function delRecord(id){
  saveHistory(loadHistory().filter(r=>r.id!==id));
  updateBadge(); renderHistory(); renderSummary();
  showToast('ลบรายการแล้ว');
}

/* ─── Monthly summary ─── */
function renderSummary(){
  const hist = loadHistory();
  const wrap = document.getElementById('summary-wrap');
  if(!hist.length){ wrap.innerHTML='<div class="empty-state">ยังไม่มีข้อมูล</div>'; return; }
  const byM={};
  hist.forEach(r=>{
    const m=r.date.slice(0,7);
    if(!byM[m]) byM[m]={thb:0,usd:0,count:0};
    byM[m].thb+=r.thb; byM[m].usd+=r.usd; byM[m].count++;
  });
  wrap.innerHTML='<div class="month-grid">'+Object.keys(byM).sort().reverse().map(m=>`
    <div class="month-item">
      <div class="mi-label">${m}</div>
      <div class="mi-total">${fmt(byM[m].thb,2)} THB</div>
      <div class="mi-count">${byM[m].count} รายการ · ${fmt(byM[m].usd,2)} USD</div>
    </div>`).join('')+'</div>';
}

/* ─── Export Excel ─── */
function exportExcel(){
  const hist=loadHistory().slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(!hist.length){ showToast('ยังไม่มีข้อมูลให้ export'); return; }

  const detail=[['วันที่','จำนวน USD','อัตราขาย (THB/USD)','ยอด THB','หมายเหตุ']];
  hist.forEach(r=>detail.push([r.date,r.usd,r.rate,+r.thb.toFixed(2),r.note||'']));

  const byM={};
  hist.forEach(r=>{
    const m=r.date.slice(0,7);
    if(!byM[m]) byM[m]={thb:0,usd:0,count:0};
    byM[m].thb+=r.thb; byM[m].usd+=r.usd; byM[m].count++;
  });
  const summ=[['เดือน','จำนวนรายการ','รวม USD','รวม THB']];
  Object.keys(byM).sort().forEach(m=>summ.push([m,byM[m].count,+byM[m].usd.toFixed(2),+byM[m].thb.toFixed(2)]));
  summ.push(['รวมทั้งหมด',hist.length,
    +hist.reduce((s,r)=>s+r.usd,0).toFixed(2),
    +hist.reduce((s,r)=>s+r.thb,0).toFixed(2)]);

  const wb=XLSX.utils.book_new();
  const ws1=XLSX.utils.aoa_to_sheet(detail);  ws1['!cols']=[{wch:12},{wch:14},{wch:22},{wch:16},{wch:24}];
  const ws2=XLSX.utils.aoa_to_sheet(summ);    ws2['!cols']=[{wch:12},{wch:14},{wch:14},{wch:16}];
  XLSX.utils.book_append_sheet(wb,ws1,'รายการคำนวณ');
  XLSX.utils.book_append_sheet(wb,ws2,'สรุปรายเดือน');
  XLSX.writeFile(wb,`fx-usd-thb-${todayStr()}.xlsx`);
  showToast('ดาวน์โหลดไฟล์ Excel เรียบร้อย');
}

/* ─── Clear all ─── */
function clearAll(){
  if(!confirm('ล้างประวัติรายการทั้งหมด? (Token ยังคงอยู่)')) return;
  localStorage.removeItem(KEY_HIST);
  rateCache={}; currentRate=null; currentRateDate=null;
  updateBadge(); renderHistory(); renderSummary();
  showToast('ล้างข้อมูลทั้งหมดแล้ว');
}

/* ─── Theme ─── */
const THEME_KEY = 'fx_theme';
function applyTheme(dark){
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.getElementById('theme-icon').textContent  = dark ? '☀️' : '🌙';
  document.getElementById('theme-label').textContent = dark ? 'Light' : 'Dark';
}
function toggleTheme(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const next = !isDark;
  applyTheme(next);
  localStorage.setItem(THEME_KEY, next ? 'dark' : 'light');
}

/* ─── Init ─── */
(function(){
  // โหลด theme
  const savedTheme = localStorage.getItem(THEME_KEY);
  applyTheme(savedTheme === 'dark');

  const saved=loadToken();
  if(saved){ document.getElementById('api-token').value=saved;
    document.getElementById('token-saved-label').classList.add('show'); }
  document.getElementById('calc-date').value=todayStr();
  updateBadge(); renderHistory(); renderSummary();
  if(saved) onDateChange();
})();
</script>
